# .github/workflows/generate-cv-pdf.yml
name: Generate CV PDF

on:
  push:
    branches: [main, master]
    paths:
      - "assets/json/resume.json"
      - "_includes/resume/**"
      - "_layouts/cv.liquid"
      - ".github/workflows/generate-cv-pdf.yml"

  # Allow manual triggering
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install PDF generation dependencies
        run: |
          npm init -y
          npm install puppeteer fs-extra

      - name: Install Jekyll dependencies
        run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Start Jekyll server in background
        run: |
          bundle exec jekyll serve --host 0.0.0.0 --port 4000 --detach
          sleep 10  # Wait for server to start

      - name: Copy PDF generation script
        run: |
          cat > generate-cv-pdf.js << 'EOF'
          ${{ steps.read-script.outputs.content || 'const CVPDFGenerator = require("./cv-pdf-generator.js"); new CVPDFGenerator().generatePDF().then(() => console.log("PDF generated")).catch(console.error);' }}
          EOF

      - name: Generate PDF
        run: node generate-cv-pdf.js

      - name: Commit and push PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Check if PDF was created and is different
          if [ -f "assets/pdf/cv.pdf" ]; then
            git add assets/pdf/cv.pdf
            
            # Only commit if there are changes
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Auto-update CV PDF [skip ci]"
              git push
            fi
          else
            echo "PDF file not found"
            exit 1
          fi

  # Alternative job using a different approach with wkhtmltopdf
  generate-pdf-alternative:
    runs-on: ubuntu-latest
    if: false # Set to true to use this approach instead

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf xvfb

      - name: Build Jekyll site
        run: |
          bundle install
          bundle exec jekyll build

      - name: Start Jekyll server
        run: |
          cd _site
          python3 -m http.server 8000 &
          sleep 5

      - name: Generate PDF with wkhtmltopdf
        run: |
          mkdir -p assets/pdf
          xvfb-run wkhtmltopdf \
            --page-size A4 \
            --margin-top 20mm \
            --margin-bottom 20mm \
            --margin-left 15mm \
            --margin-right 15mm \
            --print-media-type \
            --enable-local-file-access \
            http://localhost:8000/cv/ \
            assets/pdf/cv.pdf

      - name: Commit and push PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/pdf/cv.pdf

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update CV PDF [skip ci]"
            git push
          fi
